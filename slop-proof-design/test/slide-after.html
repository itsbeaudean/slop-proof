<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Q3 review slide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
    background: #E8EDF2;
    color: #1E2A36;
    padding: 64px 96px 48px;
  }
  h1 {
    font-size: 48px;
    font-weight: 700;
    line-height: 1.2;
    max-width: 22ch;
    margin: 0 0 16px;
  }
  .context {
    font-size: 24px;
    font-weight: 400;
    color: #3D4D5C;
    margin: 0 0 48px;
  }
  .plot {
    display: grid;
    grid-template-columns: 64px 1fr;
    grid-template-rows: 1fr 48px;
    column-gap: 16px;
    height: 720px;
    width: 1408px;
  }
  .y {
    grid-row: 1;
    grid-column: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: flex-end;
    font-size: 24px;
    font-variant-numeric: tabular-nums;
    color: #3D4D5C;
    line-height: 1;
    padding-top: 8px;
  }
  .stage {
    grid-row: 1;
    grid-column: 2;
    position: relative;
    border-bottom: 2px solid #8A96A3;
  }
  .gridline {
    position: absolute;
    left: 0;
    right: 0;
    border-top: 1px solid #C5CDD6;
  }
  .bars {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: flex-end;
    justify-content: flex-start;
    gap: 64px;
    padding: 0 32px;
  }
  .item {
    flex: 0 0 160px;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
  }
  .value {
    font-size: 24px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    margin-bottom: 8px;
    color: #1E2A36;
  }
  .item:not(.lead) .value { font-weight: 400; color: #3D4D5C; }
  .bar {
    width: 160px;
    background: #A8B2BD;
  }
  .item.lead .bar { background: #1E4D7B; }
  .names {
    grid-row: 2;
    grid-column: 2;
    display: flex;
    gap: 64px;
    padding: 12px 32px 0;
    font-size: 24px;
  }
  .names span {
    flex: 0 0 160px;
    text-align: center;
    color: #1E2A36;
  }
  .names .lead { font-weight: 700; }
</style>
</head>
<body>
  <h1>North grew most because of the new Brisbane depot</h1>
  <p class="context">Q3 revenue by region, $m</p>
  <div class="plot">
    <div class="y" aria-hidden="true">
      <span>5</span><span>4</span><span>3</span><span>2</span><span>1</span><span>0</span>
    </div>
    <div class="stage">
      <div class="gridline" style="top:0"></div>
      <div class="gridline" style="top:20%"></div>
      <div class="gridline" style="top:40%"></div>
      <div class="gridline" style="top:60%"></div>
      <div class="gridline" style="top:80%"></div>
      <div class="bars">
        <div class="item lead">
          <div class="value">4.96</div>
          <div class="bar" style="height:calc((100% - 32px) * 4.96 / 5)"></div>
        </div>
        <div class="item">
          <div class="value">4.64</div>
          <div class="bar" style="height:calc((100% - 32px) * 4.64 / 5)"></div>
        </div>
        <div class="item">
          <div class="value">4.2</div>
          <div class="bar" style="height:calc((100% - 32px) * 4.2 / 5)"></div>
        </div>
        <div class="item">
          <div class="value">4.1</div>
          <div class="bar" style="height:calc((100% - 32px) * 4.1 / 5)"></div>
        </div>
      </div>
    </div>
    <div class="names">
      <span class="lead">North</span>
      <span>South</span>
      <span>East</span>
      <span>West</span>
    </div>
  </div>
</body>
</html>
