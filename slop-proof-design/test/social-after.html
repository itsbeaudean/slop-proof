<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brewline social ad</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: #1F1914;
    color: #F3EBE0;
  }
  .frame {
    width: 1080px;
    height: 1350px;
    padding: 64px 64px 80px;
  }
  .brand {
    font-size: 20px;
    font-weight: 600;
    line-height: 1.2;
  }
  .photo {
    margin-top: 32px;
    width: 952px;
    height: 720px;
    background: #2A231C;
    color: #D4C4B0;
    font-size: 20px;
    font-weight: 400;
    line-height: 720px;
    text-align: center;
  }
  h1 {
    margin-top: 48px;
    font-size: 60px;
    font-weight: 600;
    line-height: 1.15;
  }
  .sub {
    margin-top: 16px;
    max-width: 32ch;
    font-size: 24px;
    font-weight: 400;
    line-height: 1.4;
    color: #D4C4B0;
  }
  .cta {
    display: inline-block;
    margin-top: 32px;
    padding: 16px 32px;
    background: #E8B86A;
    color: #1F1914;
    font-size: 24px;
    font-weight: 600;
    line-height: 1.2;
    border-radius: 4px;
  }
  .date {
    margin-top: 16px;
    font-size: 20px;
    font-weight: 400;
    line-height: 1.4;
    color: #D4C4B0;
  }
</style>
</head>
<body>
  <div class="frame">
    <p class="brand">Brewline</p>
    <div class="photo">[product photo]</div>
    <h1>Grinds and brews a cup<br>in about 2 minutes</h1>
    <p class="sub">Countertop coffee machine. The app remembers each person’s strength setting.</p>
    <span class="cta">Pre-order for $349</span>
    <p class="date">Pre-orders open 1 March</p>
  </div>
</body>
</html>
